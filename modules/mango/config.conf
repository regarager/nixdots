# =============================================================================
# MangoWC configuration
#
# Port of the Hyprland setup in ../hypr (hyprland.lua + conf/*.lua) to mango.
# Reference: https://mangowm.github.io/docs
# Validate:  mango -c config.conf -p
# Reload:    super + shift + r
# =============================================================================

# -----------------------------------------------------------------------------
# Environment (conf/env.lua)
# XDG_CURRENT_DESKTOP is set to "mango" by the compositor itself.
# -----------------------------------------------------------------------------
env=ELECTRON_OZONE_PLATFORM_HINT,wayland
env=XCURSOR_SIZE,24
env=HYPRCURSOR_SIZE,24
env=XDG_SESSION_TYPE,wayland
env=QT_QPA_PLATFORM,wayland
env=QT_QPA_PLATFORMTHEME,qt5ct
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=QT_AUTO_SCREEN_SCALE_FACTOR,1
env=QT_STYLE_OVERRIDE,kvantum
# conf/monitors.lua set GDK_SCALE=2 for the force_zero_scaling setup
env=GDK_SCALE,2

# -----------------------------------------------------------------------------
# Monitors (conf/monitors.lua)
#
# Hyprland used position/scale = auto. Mango has no auto scale and defaults to
# 1; the internal panel is 2880x1800 (HiDPI) so it needs scale:2 to match the
# GDK_SCALE=2 / force_zero_scaling setup. DP-1 is a 1080p panel and stays at 1.
# -----------------------------------------------------------------------------
monitorrule=name:^DP-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1
monitorrule=name:^HDMI-A-1$
monitorrule=name:^eDP-1$,scale:2

# conf/monitors.lua: xwayland.force_zero_scaling = true
xwayland_ignore_scale=1

# -----------------------------------------------------------------------------
# Appearance (conf/appearance.lua)
# -----------------------------------------------------------------------------

# general: gaps_in = 4, gaps_out = 0, border_size = 2, allow_tearing = false
gappih=4
gappiv=4
gappoh=0
gappov=0
borderpx=2
allow_tearing=0

# general.layout = "master" -> mango's master/stack layout is "tile"
# (new_is_master=0 and mfact=0.55 match hyprland's master defaults)
tagrule=id:*,layout_name:tile
new_is_master=0
default_mfact=0.55
default_nmaster=1
tag_num=9

# decoration: rounding = 0, opacities = 1.0
border_radius=0
focused_opacity=1.0
unfocused_opacity=1.0

# decoration.blur: enabled, size 3, passes 1, vibrancy 0.1696
blur=1
blur_layer=1
blur_optimized=1
blur_params_radius=3
blur_params_num_passes=1
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

# animations.enabled = false. The types/curves below mirror the (disabled)
# windowsIn/Out/Move and layersIn/Out definitions so they are ready to flip on.
animations=0
layer_animations=0
animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=250
animation_duration_open=250
animation_duration_tag=350
animation_duration_close=300
animation_duration_focus=0
# bounce / buttery / smooth beziers from appearance.lua
animation_curve_open=0.0,1.25,0.15,1.0
animation_curve_move=0.1,1.15,0.15,1.02
animation_curve_tag=0.0,0.0,0.12,1.0
animation_curve_close=0.0,0.0,0.12,1.0
animation_curve_focus=0.0,0.0,0.12,1.0
animation_curve_opafadein=0.0,0.0,0.12,1.0
animation_curve_opafadeout=0.0,0.0,0.12,1.0
tag_animation_direction=1

# window rules (appearance.lua)
# suppress maximize events for every window (mango ignores them by default)
windowrule=ignore_maximize:1,appid:.*
# floating xdg-desktop-portal-gtk, 800x600 and centered
windowrule=isfloating:1,width:800,height:600,appid:xdg-desktop-portal-gtk

# layer rules: no animation on hyprpicker/selection (no_anim = true)
layerrule=noanim:1,layer_name:hyprpicker
layerrule=noanim:1,layer_name:selection

# -----------------------------------------------------------------------------
# Misc (mango defaults that differ from hyprland's)
# -----------------------------------------------------------------------------
# hyprland misc:focus_on_activate = false
focus_on_activate=0
# hyprland does not warp the cursor on keyboard focus changes
warpcursor=0

# -----------------------------------------------------------------------------
# Input (conf/input.lua)
# -----------------------------------------------------------------------------

# keyboard: kb_layout = pl, kb_options = grp:alt_altgr_toggle
xkb_rules_layout=pl
xkb_rules_options=grp:alt_altgr_toggle

# follow_mouse = 1
sloppyfocus=1

# sensitivity = 0, accel_profile = "flat"
mouse_accel_profile=1
mouse_accel_speed=0.0
trackpad_accel_profile=1

# touchpad: natural_scroll = false, scroll_factor = 0.5, tap_to_click = false
trackpad_natural_scrolling=0
trackpad_scroll_factor=0.5
tap_to_click=0
tap_and_drag=0
drag_lock=0

# hl.gesture: 3-finger horizontal swipe switches workspaces
gesturebind=none,left,3,viewnext_have_client
gesturebind=none,right,3,viewprev_have_client

# -----------------------------------------------------------------------------
# Keybinds (conf/keybinds.lua) — mainMod = SUPER
# programs.terminal = ghostty, programs.browser = waterfox,
# programs.fileManager = dolphin, programs.menu = "pidof rofi || rofi -i -show drun"
# -----------------------------------------------------------------------------
bind=SUPER,t,spawn,ghostty
bind=SUPER,f,spawn,waterfox
bind=SUPER,q,killclient
bind=SUPER+SHIFT,l,spawn,hyprlock
bind=SUPER,e,spawn,dolphin
bind=SUPER,v,togglefloating
bind=SUPER,space,spawn_shell,pidof rofi || rofi -i -show drun
# pseudo tiling -> closest mango equivalent is maximize-within-tile
bind=SUPER,p,togglemaximizescreen

# move focus
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# workspaces/tags 1-9
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# next/prev workspace (hyprland's workspace +1/-1 cycles; tag_carousel does the same)
tag_carousel=1
bind=SUPER,bracketright,viewtoright
bind=SUPER,bracketleft,viewtoleft

# fullscreen
bind=SUPER+SHIFT,f,togglefullscreen

# mouse binds
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# screenshots (grimblast/hyprpicker) — released binds
bindr=CTRL+ALT,3,spawn_shell,grimblast --notify --freeze copysave output ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%m-%s).png
bindr=CTRL+ALT,4,spawn,hyprpicker --autocopy --format=hex --lower
bindr=CTRL+ALT,5,spawn_shell,grimblast --notify --freeze copysave area ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%m-%s).png

# media keys
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5-%
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ .05+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ .05-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle

# scripts
bind=SUPER,backspace,spawn,rofi -show p -modi p:rofi-power-menu

# CONTROL+SHIFT+M passthrough to vesktop (hyprland pass rule)
windowrule=globalkeybinding:ctrl+shift-m,appid:vesktop

# mango-specific: hyprland reloads its config automatically, mango needs this
bind=SUPER+SHIFT,r,reload_config
# bind=SUPER+SHIFT,m,quit

# -----------------------------------------------------------------------------
# Autostart (conf/autostart.lua)
# -----------------------------------------------------------------------------
# hyprpaper cannot run under mango (wlroots exposes layer-shell v5, hyprpaper
# only supports <= v4), so use swaybg for the wallpaper instead.
exec-once=swaybg -i ~/.config/wallpaper.jpg -m fill
exec-once=hypridle
exec-once=waybar
exec-once=mako
exec-once=mpd
# nixos path: hyprpolkitagent only ships a libexec binary
exec-once=/run/current-system/sw/libexec/hyprpolkitagent

# autostart.lua opened vesktop on workspace 1 and the browser on workspace 2
windowrule=tags:1,appid:vesktop
windowrule=tags:2,appid:waterfox
exec-once=vesktop
exec-once=waterfox

# -----------------------------------------------------------------------------
# Overview / workspace switcher (conf/plugins.lua)
#
# The hyprland scroll-overview plugin is disabled (commented out) and has no
# mango equivalent as a plugin; mango implements overviews natively.
#
# ALT+Tab is a scrollable workspace switcher: hold ALT and press Tab to cycle
# through the tags (workspaces) on this monitor, SHIFT+Tab to go backwards,
# then release ALT to switch to the highlighted workspace.
#
# The built-in overview (toggleoverview / togglejump) is still available; it
# shows every tag's windows with left-click-to-jump, right-click-to-close and
# jump labels, so no submap is needed.
# -----------------------------------------------------------------------------
overviewgappi=5
overviewgappo=30
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overcircle_center_ratio=0.5
bind=ALT,Tab,switcher,all_tag_next
bind=ALT+SHIFT,Tab,switcher,all_tag_prev
# gesturebind=none,up,4,toggleoverview
# gesturebind=none,down,4,toggleoverview
